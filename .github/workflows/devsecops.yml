name: DevSecOps

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  secrets:
    name: 1. Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (histórico completo)
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSfL -o /tmp/gl.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --verbose \
            --exit-code 1 --report-format sarif --report-path gitleaks.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.sarif

  sast:
    name: 2a. SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Semgrep (OWASP Top 10, Python, JWT, secrets, Dockerfile)
        run: |
          pip install --quiet semgrep
          semgrep scan \
            --config p/python --config p/owasp-top-ten --config p/jwt \
            --config p/secrets --config p/dockerfile \
            --severity ERROR --error --metrics off \
            --sarif --output semgrep.sarif \
            app iot scripts seed Dockerfile
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sast-bandit:
    name: 2b. SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Bandit (falha em severidade/confiança média ou maior)
        run: |
          pip install --quiet bandit==1.9.4
          bandit -r app iot scripts seed -ll -ii

  sca:
    name: 3. SCA (pip-audit + Dependency Review)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit (falha se houver CVE conhecida)
        run: |
          pip install --quiet pip-audit==2.10.1
          pip-audit -r requirements.txt --strict --desc on
      - name: Dependency Review (bloqueia PR que introduz dependência vulnerável)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
          comment-summary-in-pr: on-failure

  test:
    name: 4. Testes de segurança e contrato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: pytest (JWT, RBAC, BOLA, validação, rate limit, cripto, IoT, backup)
        run: pytest --cov=app --cov=iot --cov-report=xml --cov-fail-under=80 --junitxml=pytest.xml
      - name: Migrações Alembic aplicam do zero (0001 → head)
        run: APP_ENV=test DATABASE_URL=sqlite:////tmp/migracao.db alembic upgrade head
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            pytest.xml
            coverage.xml

  iac:
    name: 5. IaC security (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e
        with:
          directory: .
          framework: dockerfile,kubernetes,github_actions,secrets
          skip_path: venv
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

  build:
    name: 6. Build + Container scan (Trivy) + SBOM
    needs: [secrets, sast, sast-bandit, sca, test, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fordspec-api:${{ github.sha }}
          provenance: false
      - name: Trivy — vulnerabilidades da imagem (bloqueia HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: fordspec-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: fordspec-api:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Exporta imagem para o DAST
        run: docker save fordspec-api:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  dast:
    name: 7. DAST (OWASP ZAP API scan)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
      - name: Sobe a API em modo staging (segredos efêmeros de CI)
        run: |
          docker load -i image.tar
          gen() { openssl rand -base64 48 | tr -d '\n'; }
          docker run -d --name api -p 8000:8000 \
            -e APP_ENV=staging \
            -e DATABASE_URL=sqlite:////tmp/ci.db \
            -e JWT_SECRET="$(gen)" -e DATA_ENC_KEYS="$(gen)" \
            -e PSEUDO_SALT="$(gen)" -e METRICS_TOKEN="$(gen)" \
            -e ALLOWED_HOSTS=localhost,127.0.0.1             -e RATE_LIMIT_DEFAULT=100000 -e RATE_LIMIT_LOGIN=100000 -e RATE_LIMIT_REFRESH=100000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            fordspec-api:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs http://localhost:8000/ && break; sleep 2; done
      - name: ZAP API scan
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d
        with:
          target: http://localhost:8000/openapi.json
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: "-I"
          allow_issue_writing: false
      - name: Logs da API (evidência)
        if: always()
        run: docker logs api | tail -n 200

  deploy:
    name: 8. Publica, assina e implanta
    needs: dast
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem em minúsculas (exigência do registry)
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fordspec-api" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build e push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Assina a imagem (cosign keyless)
        run: cosign sign --yes ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
      - name: Deploy no Kubernetes (imagem fixada por digest)
        if: env.KUBE_CONFIG != ''
        run: |
          echo "$KUBE_CONFIG" > kubeconfig && export KUBECONFIG=$PWD/kubeconfig
          IMG=${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          kubectl apply -f k8s/00-namespace.yaml -f k8s/04-networkpolicy.yaml
          kubectl -n fordspec delete job fordspec-migrate --ignore-not-found
          sed "s#ghcr.io/fordspec/fordspec-api:2.0.0#$IMG#" k8s/05-migrate-job.yaml | kubectl apply -f -
          kubectl -n fordspec wait --for=condition=complete job/fordspec-migrate --timeout=180s
          sed "s#ghcr.io/fordspec/fordspec-api:2.0.0#$IMG#" k8s/02-deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/03-ingress.yaml
          kubectl -n fordspec rollout status deploy/fordspec-api --timeout=180s
          rm -f kubeconfig
