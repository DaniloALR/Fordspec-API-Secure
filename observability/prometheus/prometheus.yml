global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    projeto: fordspec

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: fordspec-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]

  - job_name: fordspec-iot-ingest
    static_configs:
      - targets: ["iot-ingest:9101"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
