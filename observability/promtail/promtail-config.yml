# Lê o arquivo JSONL da API por volume compartilhado (sem montar o docker.sock).
server:
  http_listen_port: 9080
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: fordspec-api
    static_configs:
      - targets: [localhost]
        labels:
          job: fordspec-api
          __path__: /var/log/fordspec/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            nivel: nivel
            tipo: tipo
            evento: evento
      - labels:
          nivel:
          tipo:
          evento:
      - timestamp:
          source: ts
          format: RFC3339Nano
