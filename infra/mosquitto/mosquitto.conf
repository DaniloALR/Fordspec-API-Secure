# Mosquitto — broker MQTT da telemetria FordSpec (hardening)
# Somente TLS, autenticação mútua por certificado e ACL por dispositivo.

per_listener_settings false
allow_anonymous false

# Nenhum listener em 1883 (texto claro). Apenas 8883/TLS.
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
ciphers_tls1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
# mTLS: cliente sem certificado assinado pela CA FordSpec é recusado
require_certificate true
# o CN do certificado vira o usuário usado na ACL (%u)
use_identity_as_username true
crlfile /mosquitto/certs/ca.crl

acl_file /mosquitto/config/acl

# limites contra abuso / DoS
max_packet_size 4096
max_inflight_messages 20
max_queued_messages 1000
max_connections 1000

persistence true
persistence_location /mosquitto/data/

# logs para o pipeline de observabilidade
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
