<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1473E6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="640" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#0C447C">FordSpec AI - Arquitetura (SOA / Web Services)</text>
  <text x="40" y="66" font-size="13" fill="#5F6B7A">Desafio 01 - 3 camadas - 4 servicos independentes - PostgreSQL</text>

  <rect x="320" y="90" width="260" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="450" y="113" font-size="14" font-weight="600" fill="#0C447C" text-anchor="middle">Cliente (App Mobile / Swagger)</text>
  <text x="450" y="129" font-size="11" fill="#5F6B7A" text-anchor="middle">HTTP REST - JSON</text>
  <line x1="450" y1="138" x2="450" y2="166" stroke="#1473E6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="40" y="168" width="820" height="92" rx="12" fill="#F4F8FD" stroke="#B5D4F4" stroke-width="1"/>
  <text x="58" y="190" font-size="14" font-weight="700" fill="#0C447C">Camada de Apresentacao - routers (FastAPI)</text>
  <rect x="70" y="200" width="370" height="46" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
  <text x="255" y="228" font-size="12.5" fill="#16202E" text-anchor="middle">GET /v1/attributes - GET /v1/vehicles</text>
  <rect x="460" y="200" width="390" height="46" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
  <text x="655" y="228" font-size="12.5" fill="#16202E" text-anchor="middle">POST /v1/specs - GET /v1/specs/export</text>
  <line x1="450" y1="260" x2="450" y2="288" stroke="#1473E6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="40" y="290" width="820" height="118" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="58" y="312" font-size="14" font-weight="700" fill="#0F6E56">Camada de Servico - 4 servicos independentes e reutilizaveis (SOA)</text>
  <rect x="66" y="324" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
  <text x="161" y="352" font-size="13" font-weight="700" fill="#0F6E56" text-anchor="middle">catalog-service</text>
  <text x="161" y="372" font-size="11" fill="#5F6B7A" text-anchor="middle">dicionario de atributos</text>
  <rect x="268" y="324" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
  <text x="363" y="352" font-size="13" font-weight="700" fill="#0F6E56" text-anchor="middle">vehicle-service</text>
  <text x="363" y="372" font-size="11" fill="#5F6B7A" text-anchor="middle">base curada</text>
  <rect x="470" y="324" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
  <text x="565" y="352" font-size="13" font-weight="700" fill="#0F6E56" text-anchor="middle">spec-service</text>
  <text x="565" y="372" font-size="11" fill="#5F6B7A" text-anchor="middle">monta a ficha</text>
  <rect x="672" y="324" width="172" height="70" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
  <text x="758" y="352" font-size="13" font-weight="700" fill="#0F6E56" text-anchor="middle">export-service</text>
  <text x="758" y="372" font-size="11" fill="#5F6B7A" text-anchor="middle">formato BASE</text>
  <line x1="450" y1="408" x2="450" y2="436" stroke="#1473E6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="40" y="438" width="820" height="92" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="58" y="460" font-size="14" font-weight="700" fill="#444441">Camada de Dados - repositories (unica que acessa o ORM)</text>
  <rect x="70" y="470" width="780" height="46" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
  <text x="460" y="498" font-size="12.5" fill="#16202E" text-anchor="middle">AttributeRepository - VehicleRepository - SpecRepository (SQLAlchemy)</text>
  <line x1="450" y1="530" x2="450" y2="558" stroke="#1473E6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="320" y="560" width="260" height="58" rx="10" fill="#042C53" stroke="#042C53"/>
  <text x="450" y="584" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">PostgreSQL</text>
  <text x="450" y="604" font-size="11" fill="#B5D4F4" text-anchor="middle">attribute - vehicle_version - spec_value</text>
</svg>
