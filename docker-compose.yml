# Ambiente completo FordSpec: API + Postgres + MQTT/TLS + observabilidade.
#   1) cp .env.example .env  (preencher)      2) sh scripts/gen_dev_certs.sh
#   3) mkdir secrets && gravar secrets/metrics_token.txt e secrets/alert_webhook_url.txt
#   4) docker compose up -d --build
# Portas publicadas apenas em 127.0.0.1. Banco e broker ficam em rede interna.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  db:
    <<: *hardening
    image: postgres:16.4-alpine
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_READ_SEARCH]  # mínimo exigido pelo entrypoint
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    tmpfs: ["/tmp", "/var/run/postgresql"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    deploy:
      resources: {limits: {cpus: "1", memory: 512M}}

  migrate:
    <<: *hardening
    build: .
    image: fordspec-api:local
    restart: "no"
    env_file: .env
    command: ["sh", "-c", "alembic upgrade head && python -m seed.seed_database"]
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]

  api:
    <<: *hardening
    image: fordspec-api:local
    env_file: .env
    environment:
      LOG_FILE: /var/log/fordspec/app.jsonl
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - api-logs:/var/log/fordspec
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [frontend, backend]
    deploy:
      resources: {limits: {cpus: "1", memory: 512M}}

  mosquitto:
    <<: *hardening
    image: eclipse-mosquitto:2.0.20
    user: "1883:1883"
    ports: ["127.0.0.1:8883:8883"]   # somente TLS; 1883 não é exposta
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro
      - ./infra/certs:/mosquitto/certs:ro
      - mqtt-data:/mosquitto/data
    networks: [iot, edge]  # edge: rede publicada para os veículos

  iot-ingest:
    <<: *hardening
    image: fordspec-api:local
    command: ["python", "-m", "iot.mqtt_secure_client", "subscribe"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_CA: /certs/ca.crt
      MQTT_CERT: /certs/ingest-service.crt
      MQTT_KEY: /certs/ingest-service.key
      IOT_HMAC_MASTER_KEY: ${IOT_HMAC_MASTER_KEY}
    volumes:
      - ./infra/certs:/certs:ro
    depends_on: [mosquitto]
    networks: [iot, monitoring]

  prometheus:
    <<: *hardening
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prom-data:/prometheus
    secrets: [metrics_token]
    ports: ["127.0.0.1:9090:9090"]
    networks: [frontend, monitoring]

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - am-data:/alertmanager
    secrets: [alert_webhook_url]
    networks: [monitoring]

  loki:
    <<: *hardening
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks: [monitoring]

  promtail:
    <<: *hardening
    image: grafana/promtail:3.2.0
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - api-logs:/var/log/fordspec:ro
    networks: [monitoring]

  grafana:
    <<: *hardening
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    networks: [frontend, monitoring]

networks:
  frontend: {}
  edge: {}
  backend: {internal: true}     # banco sem acesso à internet
  iot: {internal: true}
  monitoring: {internal: true}

volumes:
  db-data: {}
  api-logs: {}
  mqtt-data: {}
  prom-data: {}
  am-data: {}
  loki-data: {}
  grafana-data: {}

secrets:
  metrics_token:
    file: ./secrets/metrics_token.txt
  alert_webhook_url:
    file: ./secrets/alert_webhook_url.txt
