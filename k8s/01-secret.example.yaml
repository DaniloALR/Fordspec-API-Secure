# MODELO — não aplique com valores reais versionados.
# Em produção os segredos vêm do cofre (Azure Key Vault / AWS Secrets Manager /
# HashiCorp Vault) via External Secrets Operator ou Secrets Store CSI Driver,
# e o etcd do cluster deve ter criptografia em repouso habilitada.
apiVersion: v1
kind: Secret
metadata:
  name: fordspec-api-secrets
  namespace: fordspec
type: Opaque
stringData:
  JWT_SECRET: "<preencher-via-cofre>"
  DATA_ENC_KEYS: "<preencher-via-cofre>"
  HMAC_SECRET: "<preencher-via-cofre>"
  PSEUDO_SALT: "<preencher-via-cofre>"
  METRICS_TOKEN: "<preencher-via-cofre>"
  DATABASE_URL: "<preencher-via-cofre>"
