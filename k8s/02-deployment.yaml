apiVersion: v1
kind: ServiceAccount
metadata:
  name: fordspec-api
  namespace: fordspec
# a API não fala com a API do Kubernetes: sem token montado no pod
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fordspec-api
  namespace: fordspec
  labels: {app: fordspec-api}
  annotations:
    # a tag abaixo é substituída pelo digest da imagem assinada no job de deploy
    checkov.io/skip1: CKV_K8S_43=digest injetado pelo pipeline (kubectl set image ...@sha256)
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: fordspec-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: fordspec-api}
    spec:
      serviceAccountName: fordspec-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          # o pipeline substitui pela imagem assinada, fixada por digest (@sha256:...)
          image: ghcr.io/fordspec/fordspec-api:2.0.0
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: APP_ENV, value: production}
            - {name: ALLOWED_HOSTS, value: "api.fordspec.example,localhost,127.0.0.1"}
            - {name: ALLOWED_ORIGINS, value: "https://app.fordspec.example"}
            - {name: LOG_FILE, value: ""}   # em k8s os logs vão só para stdout
            # segredos lidos de ARQUIVOS montados (padrão NOME_FILE), não de env vars
            - {name: JWT_SECRET_FILE, value: /run/secrets/fordspec/JWT_SECRET}
            - {name: DATA_ENC_KEYS_FILE, value: /run/secrets/fordspec/DATA_ENC_KEYS}
            - {name: HMAC_SECRET_FILE, value: /run/secrets/fordspec/HMAC_SECRET}
            - {name: PSEUDO_SALT_FILE, value: /run/secrets/fordspec/PSEUDO_SALT}
            - {name: METRICS_TOKEN_FILE, value: /run/secrets/fordspec/METRICS_TOKEN}
            - {name: DATABASE_URL_FILE, value: /run/secrets/fordspec/DATABASE_URL}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders: [{name: Host, value: localhost}]  # TrustedHost
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: secrets, mountPath: /run/secrets/fordspec, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: secrets
          secret:
            secretName: fordspec-api-secrets
            defaultMode: 0440   # leitura para o grupo fsGroup (10001)
---
apiVersion: v1
kind: Service
metadata:
  name: fordspec-api
  namespace: fordspec
spec:
  type: ClusterIP
  selector: {app: fordspec-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fordspec-api
  namespace: fordspec
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: fordspec-api}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fordspec-api
  namespace: fordspec
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: fordspec-api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
