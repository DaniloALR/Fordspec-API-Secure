# Zero trust na rede do namespace: nega tudo e libera só o necessário.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: fordspec
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fordspec-api-ingress
  namespace: fordspec
spec:
  podSelector:
    matchLabels: {app: fordspec-api}
  policyTypes: [Ingress]
  ingress:
    # tráfego de usuários só via ingress controller
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports: [{port: 8000, protocol: TCP}]
    # coleta de métricas só pelo Prometheus
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports: [{port: 8000, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fordspec-api-egress
  namespace: fordspec
spec:
  podSelector:
    matchLabels: {app: fordspec-api}
  policyTypes: [Egress]
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    # banco gerenciado (sub-rede privada)
    - to:
        - ipBlock: {cidr: 10.20.0.0/24}
      ports: [{port: 5432, protocol: TCP}]
