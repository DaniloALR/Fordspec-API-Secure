# Namespace com Pod Security Admission no perfil "restricted":
# o cluster RECUSA pods privilegiados, com root, hostPath, capabilities extras etc.
apiVersion: v1
kind: Namespace
metadata:
  name: fordspec
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
